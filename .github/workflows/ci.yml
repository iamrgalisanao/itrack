name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets CI be re-run from the Actions tab without inventing a commit —
  # needed when a run is lost to a platform incident, or when a re-run is
  # blocked because GitHub still considers the stuck run in progress.
  workflow_dispatch:

# Superseded PR runs are cancelled so a queue of stale ones cannot build up.
# Pushes to main are never cancelled: every commit on the default branch
# should end up with its own verdict rather than inheriting a later run's.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    name: Backend (PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, json, bcmath, dom, fileinfo, curl, zip, pdo, sqlite3, pdo_sqlite
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.xml overrides DB_CONNECTION to sqlite :memory: for the test
      # run itself, so no database service container is needed here.
      - name: Run backend test suite
        run: php artisan test

  frontend-build:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The real correctness gate — catches actual compile/syntax errors.
      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

  design-tokens:
    name: Design tokens (contrast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deliberately its own job, and deliberately NOT inside frontend-build:
      # that job sets working-directory: frontend at the defaults level, and this
      # script reads frontend/src/index.css by a repo-root-relative path. A
      # contrast regression and a compile error are also different verdicts and
      # should not share one red X. No npm install, no setup-python — the script
      # is stdlib-only, and relying on the runner's python3 fails loudly rather
      # than skipping silently if it ever disappears.
      - name: Verify status-token contrast (WCAG AA)
        run: python3 scripts/verify-contrast.py

  cascade:
    name: Design tokens (cascade)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Its own job, for the same reasons design-tokens is: a different verdict
      # deserves a different red X, and this needs a built stylesheet where that
      # one needs only source text.
      #
      # Unlike design-tokens this DOES need a browser, and that cost was weighed
      # rather than assumed. The defect class it guards -- valid CSS that loses
      # the cascade, or a utility that never emits -- has shipped four times
      # (PRs #17, #20, #22) and is invisible to every text-based check we have.
      # A local-only gate protecting a four-time recurrence is a gate in name.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # The suite reads the built stylesheet, not the source: the whole point is
      # to measure what the browser resolves, and that only exists after a build.
      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium

      # CASCADE_REQUIRED=1 turns a missing engine into a failure instead of a
      # skip. Without it, reordering or breaking the install step above would
      # leave this job GREEN while running no assertions at all -- which is
      # precisely the failure mode the suite's own canary exists to catch, one
      # level up. Green must mean measured.
      - name: Verify cascade resolution
        env:
          CASCADE_REQUIRED: '1'
        run: python3 scripts/verify-cascade.py
